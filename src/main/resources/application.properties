spring.application.name=bookshop-api

# ===== Postgres Database =====
spring.datasource.url=jdbc:postgresql://localhost:5432/bookshop
spring.datasource.username=postgres
spring.datasource.password=#1a/m@34Bv
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

# ===== JWT =====
# Minimum 32 characters for HS256
jwt.secret=bookshop-super-secret-key-change-me-in-production-32chars
jwt.expiration-ms=86400000

# OAuth2 Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
